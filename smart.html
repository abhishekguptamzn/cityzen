<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Smart Cityzen</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
:root{
--primary:#1e40af;--primary-light:#3b82f6;--primary-dark:#1e3a8a;
--secondary:#059669;--secondary-light:#10b981;
--accent:#7c3aed;--accent-light:#a78bfa;
--bg:#f0f4ff;--bg2:#e8edf5;
--surface:rgba(255,255,255,0.82);--surface-solid:#fff;
--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
--border:rgba(30,64,175,0.1);
--shadow:0 4px 24px rgba(30,64,175,0.08);
--shadow-lg:0 8px 40px rgba(30,64,175,0.12);
--r:16px;--rs:10px;--rxs:6px;
--nav-h:68px;--hdr-h:60px;
--grad1:linear-gradient(135deg,#1e3a8a,#7c3aed,#059669);
--grad2:linear-gradient(135deg,#1e40af,#3b82f6);
--grad3:linear-gradient(135deg,#059669,#10b981);
--grad4:linear-gradient(135deg,#7c3aed,#a78bfa);
}
.dark{
--bg:#0f172a;--bg2:#1e293b;
--surface:rgba(30,41,59,0.85);--surface-solid:#1e293b;
--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
--border:rgba(148,163,184,0.1);
--shadow:0 4px 24px rgba(0,0,0,0.3);
--shadow-lg:0 8px 40px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .4s,color .4s}
#app{width:100%;max-width:430px;height:100%;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s;will-change:transform,opacity;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
.page.hidden-left{transform:translateX(-30%);opacity:0;pointer-events:none}
.page.active{transform:translateX(0);opacity:1}
.sub-page{position:absolute;inset:0;z-index:50;transform:translateX(100%);opacity:0;transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .38s;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.sub-page.active{transform:translateX(0);opacity:1}
.sub-page.exiting{transform:translateX(100%);opacity:0}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
input,textarea{font-family:inherit;outline:none;border:none}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* Splash */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--grad1);z-index:200}
#splash .logo-wrap{position:relative;width:100px;height:100px;margin-bottom:24px}
#splash .logo-ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,0.3);animation:splashSpin 2s linear infinite}
#splash .logo-ring:nth-child(2){inset:8px;border-color:rgba(255,255,255,0.5);animation-direction:reverse;animation-duration:1.5s}
#splash .logo-icon{position:absolute;inset:18px;border-radius:50%;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;animation:splashPulse 2s ease-in-out infinite}
#splash h1{color:#fff;font-size:28px;font-weight:800;letter-spacing:-0.5px;animation:fadeUp .8s .3s both}
#splash .tagline{color:rgba(255,255,255,0.8);font-size:13px;margin-top:8px;font-weight:400;animation:fadeUp .8s .5s both}
#splash .loader{margin-top:40px;width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}

@keyframes splashSpin{to{transform:rotate(360deg)}}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(30,64,175,0.3)}50%{box-shadow:0 0 40px rgba(124,58,237,0.4)}}

/* Onboarding */
#onboarding{background:var(--bg);z-index:190}
.onb-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:60px 32px 40px;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s}
.onb-slide.left{transform:translateX(-100%);opacity:0}
.onb-slide.right{transform:translateX(100%);opacity:0}
.onb-slide.center{transform:translateX(0);opacity:1}
.onb-illust{width:220px;height:220px;margin-bottom:32px;flex-shrink:0}
.onb-illust svg{width:100%;height:100%}
.onb-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:12px;color:var(--text)}
.onb-desc{font-size:14px;color:var(--text2);text-align:center;line-height:1.6;max-width:300px}
.onb-dots{display:flex;gap:8px;margin-top:auto;margin-bottom:32px}
.onb-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:all .3s}
.onb-dot.active{width:24px;border-radius:4px;background:var(--primary)}
.onb-actions{display:flex;gap:12px;width:100%}
.btn-primary{flex:1;padding:14px 24px;background:var(--grad2);color:#fff;border-radius:var(--rs);font-size:15px;font-weight:700;transition:transform .2s,box-shadow .2s}
.btn-primary:active{transform:scale(0.97)}
.btn-ghost{padding:14px 24px;color:var(--primary);font-size:15px;font-weight:600;border-radius:var(--rs);transition:background .2s}
.btn-ghost:active{background:var(--border)}

/* Auth */
#auth{background:var(--bg);z-index:180}
.auth-header{padding:48px 24px 24px;text-align:center}
.auth-header h2{font-size:24px;font-weight:800;margin-bottom:6px}
.auth-header p{color:var(--text2);font-size:13px}
.auth-tabs{display:flex;margin:0 24px;background:var(--bg2);border-radius:var(--rs);padding:4px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--text2);border-radius:8px;transition:all .3s}
.auth-tab.active{background:var(--surface-solid);color:var(--primary);box-shadow:var(--shadow)}
.auth-form{padding:24px;display:flex;flex-direction:column;gap:16px}
.input-group{position:relative}
.input-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.input-group input{width:100%;padding:14px 14px 14px 42px;background:var(--surface);backdrop-filter:blur(12px);border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;color:var(--text);transition:border-color .3s}
.input-group input:focus{border-color:var(--primary-light)}
.input-group .toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.auth-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.auth-row label{display:flex;align-items:center;gap:6px;color:var(--text2);cursor:pointer}
.auth-row label input{width:16px;height:16px;accent-color:var(--primary)}
.auth-row a{color:var(--primary);font-weight:600}
.social-divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:12px}
.social-divider::before,.social-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.social-btns{display:flex;gap:12px;justify-content:center}
.social-btn{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .2s,box-shadow .2s}
.social-btn:active{transform:scale(0.93)}
.social-btn.g{background:#ea4335;color:#fff}
.social-btn.f{background:#1877f2;color:#fff}
.social-btn.a{background:#000;color:#fff}
.social-btn.b{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.otp-row{display:flex;gap:12px;justify-content:center}
.otp-input{width:52px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);color:var(--text);transition:border-color .3s}
.otp-input:focus{border-color:var(--primary-light)}
.resend-row{text-align:center;font-size:13px;color:var(--text2)}
.resend-row button{color:var(--primary);font-weight:700;font-size:13px}

/* Main App */
#main-app{position:absolute;inset:0;z-index:100}
.tab-content{position:absolute;inset:0;padding-bottom:var(--nav-h);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;transition:opacity .25s}
.tab-content.active{opacity:1;pointer-events:all}

/* Home */
.home-header{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
.home-greet h1{font-size:20px;font-weight:800}
.home-greet p{font-size:12px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:4px}
.home-greet p i{color:var(--secondary);font-size:11px}
.home-actions{display:flex;gap:8px}
.home-actions button{width:40px;height:40px;border-radius:12px;background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:16px;position:relative;transition:transform .2s}
.home-actions button:active{transform:scale(0.92)}
.notif-badge{position:absolute;top:-2px;right:-2px;width:16px;height:16px;background:#ef4444;border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.search-bar{margin:16px 20px 0;position:relative}
.search-bar input{width:100%;padding:12px 16px 12px 42px;background:var(--surface);backdrop-filter:blur(12px);border:1.5px solid var(--border);border-radius:14px;font-size:13px;color:var(--text);transition:border-color .3s}
.search-bar input:focus{border-color:var(--primary-light)}
.search-bar i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.weather-strip{margin:16px 20px 0;padding:12px 16px;background:var(--surface);backdrop-filter:blur(12px);border-radius:var(--rs);border:1px solid var(--border);display:flex;align-items:center;gap:12px}
.weather-strip i{font-size:24px;color:#f59e0b}
.weather-strip .wt-info{flex:1}
.weather-strip .wt-info span{font-size:13px;font-weight:700}
.weather-strip .wt-info p{font-size:11px;color:var(--text2)}
.weather-strip .wt-temp{font-size:20px;font-weight:800;color:var(--primary)}

/* Digital ID Card */
.id-section{padding:20px 20px 0}
.id-section .section-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.id-card-wrap{perspective:1000px;cursor:pointer}
.id-card-inner{position:relative;width:100%;aspect-ratio:1.586;transition:transform .8s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.id-card-inner.flipped{transform:rotateY(180deg)}
.id-card-front,.id-card-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;padding:20px}
.id-card-front{background:linear-gradient(135deg,#1e3a8a 0%,#4338ca 40%,#7c3aed 70%,#059669 100%)}
.id-card-back{background:linear-gradient(135deg,#059669 0%,#7c3aed 40%,#4338ca 70%,#1e3a8a 100%);transform:rotateY(180deg)}
.id-hologram{position:absolute;inset:0;background:linear-gradient(135deg,transparent 20%,rgba(255,255,255,0.06) 30%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.06) 70%,transparent 80%);background-size:200% 200%;animation:shimmer 4s ease-in-out infinite;pointer-events:none;border-radius:18px}
.id-card-front .id-top{display:flex;justify-content:space-between;align-items:flex-start}
.id-brand{font-size:11px;font-weight:800;color:rgba(255,255,255,0.9);letter-spacing:1.5px;text-transform:uppercase}
.id-brand small{display:block;font-size:8px;font-weight:400;letter-spacing:0.5px;opacity:0.7;margin-top:2px}
.id-nfc{width:28px;height:28px;opacity:0.6}
.id-chip{width:36px;height:28px;border-radius:5px;background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);margin-top:16px;position:relative;overflow:hidden}
.id-chip::after{content:'';position:absolute;inset:3px;border:1px solid rgba(0,0,0,0.15);border-radius:3px}
.id-card-front .id-body{display:flex;gap:14px;margin-top:14px;align-items:flex-start}
.id-photo{width:56px;height:68px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);overflow:hidden;flex-shrink:0;background:rgba(255,255,255,0.1)}
.id-photo img{width:100%;height:100%;object-fit:cover}
.id-info{flex:1;color:#fff}
.id-info .id-name{font-size:15px;font-weight:800;margin-bottom:2px}
.id-info .id-number{font-size:10px;opacity:0.7;font-family:monospace;letter-spacing:1px}
.id-info .id-meta{display:flex;gap:12px;margin-top:8px;font-size:9px;opacity:0.7}
.id-info .id-meta span{display:flex;align-items:center;gap:3px}
.id-card-front .id-bottom{position:absolute;bottom:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-end}
.id-qr-mini{width:48px;height:48px;background:#fff;border-radius:6px;padding:3px}
.id-qr-mini canvas{width:100%;height:100%}
.id-verified{display:flex;align-items:center;gap:4px;color:#fff;font-size:9px;font-weight:600;opacity:0.8}
.id-verified i{color:#10b981;font-size:12px}
.id-expiry{color:rgba(255,255,255,0.6);font-size:8px;text-align:right}
.id-expiry span{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,0.8)}
.id-card-back{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
.id-back-qr{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px;margin-bottom:14px}
.id-back-qr canvas{width:100%;height:100%}
.id-back-qr p{font-size:8px;color:var(--text3);margin-top:2px}
.id-back-info{font-size:11px;line-height:1.8;opacity:0.85}
.id-back-info strong{font-size:12px}
.id-back-helpline{margin-top:12px;font-size:12px;font-weight:700;background:rgba(255,255,255,0.15);padding:8px 20px;border-radius:20px}

/* Module Grid */
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}
.module-card{border-radius:var(--r);padding:20px 16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.module-card:active{transform:scale(0.96)}
.module-card i{font-size:28px;color:#fff;margin-bottom:10px}
.module-card h3{font-size:14px;font-weight:800;color:#fff}
.module-card p{font-size:10px;color:rgba(255,255,255,0.8);margin-top:2px}
.module-card .mod-badge{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.25);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;backdrop-filter:blur(4px)}
.module-card .mod-bg{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.1)}
.module-card:nth-child(1){background:var(--grad2);box-shadow:0 6px 24px rgba(30,64,175,0.3)}
.module-card:nth-child(2){background:var(--grad3);box-shadow:0 6px 24px rgba(5,150,105,0.3)}
.module-card:nth-child(3){background:var(--grad4);box-shadow:0 6px 24px rgba(124,58,237,0.3)}
.module-card:nth-child(4){background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 6px 24px rgba(220,38,38,0.3)}

/* List Page */
.list-page-hdr{padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10}
.list-page-hdr button{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:16px}
.list-page-hdr h2{font-size:18px;font-weight:800}
.list-items{padding:0 20px 100px;display:flex;flex-direction:column;gap:12px}
.list-item{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);backdrop-filter:blur(12px);border-radius:var(--rs);border:1px solid var(--border);cursor:pointer;transition:transform .2s,box-shadow .2s}
.list-item:active{transform:scale(0.98);box-shadow:var(--shadow)}
.list-item .li-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.list-item .li-info{flex:1;min-width:0}
.list-item .li-info h4{font-size:14px;font-weight:700}
.list-item .li-info p{font-size:11px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-arrow{color:var(--text3);font-size:12px}

/* Detail Page */
.detail-hero{position:relative;height:200px;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero .detail-grad{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,transparent 60%)}
.detail-hero .detail-back{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,0.3);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;z-index:2}
.detail-hero .detail-actions{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:2}
.detail-hero .detail-actions button{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,0.3);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.detail-body{padding:0 20px 100px;margin-top:-30px;position:relative;z-index:2}
.detail-body h1{font-size:22px;font-weight:900;margin-bottom:6px}
.detail-body .detail-subtitle{font-size:13px;color:var(--text2);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.detail-body .detail-subtitle .badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.badge-green{background:rgba(5,150,105,0.12);color:var(--secondary)}
.badge-blue{background:rgba(30,64,175,0.12);color:var(--primary)}
.badge-red{background:rgba(220,38,38,0.12);color:#dc2626}
.badge-amber{background:rgba(245,158,11,0.12);color:#d97706}
.detail-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.d-card{padding:14px 16px;background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--rs)}
.d-card .d-card-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.d-card .d-card-value{font-size:13px;font-weight:600;color:var(--text);line-height:1.5}
.d-card .d-card-row{display:flex;gap:16px;flex-wrap:wrap}
.d-card .d-card-row div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.d-card .d-card-row i{color:var(--primary);font-size:13px}
.detail-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:20px}
.detail-map{height:140px;border-radius:var(--rs);overflow:hidden;margin-bottom:20px;position:relative;background:var(--bg2)}
.detail-map img{width:100%;height:100%;object-fit:cover}
.detail-map .map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);font-size:28px;color:#ef4444;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.detail-btns{display:flex;gap:10px;flex-wrap:wrap}
.detail-btns .dbtn{flex:1;min-width:120px;padding:13px 16px;border-radius:var(--rs);font-size:13px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s}
.detail-btns .dbtn:active{transform:scale(0.97)}
.dbtn-primary{background:var(--grad2);color:#fff}
.dbtn-secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--text)}
.dbtn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.dbtn-success{background:var(--grad3);color:#fff}

/* Gallery */
.gallery-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.gallery-row img{width:140px;height:100px;object-fit:cover;border-radius:var(--rxs);flex-shrink:0}
.gallery-row::-webkit-scrollbar{display:none}

/* Reviews */
.review-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.review-item:last-child{border:none}
.review-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}

function drawQR(canvas, size) {
if (!canvas) return;
canvas.width = size || 120;
canvas.height = size || 120;
const ctx = canvas.getContext('2d');
const s = canvas.width;
const m = s * 0.08;
const cs = (s - m * 2) / 25;
ctx.fillStyle = '#fff';
ctx.fillRect(0, 0, s, s);
ctx.fillStyle = '#1e293b';
function drawFinder(x, y) {
const fs = cs * 7;
ctx.fillRect(x, y, fs, fs);
ctx.fillStyle = '#fff';
ctx.fillRect(x + cs, y + cs, cs * 5, cs * 5);
ctx.fillStyle = '#1e293b';
ctx.fillRect(x + cs * 2, y + cs * 2, cs * 3, cs * 3);
}
drawFinder(m, m);
drawFinder(s - m - cs * 7, m);
drawFinder(m, s - m - cs * 7);
for (let r = 0; r < 25; r++) {
for (let c = 0; c < 25; c++) {
if ((r < 8 && c < 8) || (r < 8 && c > 16) || (r > 16 && c < 8)) continue;
if (Math.random() > 0.55) {
ctx.fillRect(m + c * cs, m + r * cs, cs, cs);
}
}
}
}

function drawBarcode(container) {
if (!container) return;
container.innerHTML = '';
const w = container.offsetWidth || 200;
const h = 36;
const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('width', w);
svg.setAttribute('height', h);
svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
let x = 0;
while (x < w) {
const bw = Math.random() > 0.5 ? (Math.random() > 0.5 ? 2 : 3) : 1;
if (Math.random() > 0.4) {
const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
rect.setAttribute('x', x);
rect.setAttribute('y', 0);
rect.setAttribute('width', bw);
rect.setAttribute('height', h);
rect.setAttribute('fill', '#fff');
svg.appendChild(rect);
}
x += bw + (Math.random() > 0.5 ? 1 : 0.5);
}
container.appendChild(svg);
}

function getGreeting() {
const h = new Date().getHours();
if (h < 12) return 'Good Morning';
if (h < 17) return 'Good Afternoon';
return 'Good Evening';
}

function formatDate() {
const d = new Date();
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function showPage(id) {

const page = $('#' + id);
if (page) { page.classList.remove('hidden'); page.classList.add('active'); }

}

function switchTab(tab) {
currentTab = tab;
 $$('.tab-content').forEach(t => t.classList.remove('active'));
const el = $('#tab-' + tab);
if (el) el.classList.add('active');
 $$('.nav-item').forEach(n => n.classList.remove('active'));
const navItem = $(`.nav-item[data-tab="${tab}"]`);
if (navItem) navItem.classList.add('active');
}

function openSubPage(html) {
const div = document.createElement('div');
div.className = 'sub-page';
div.innerHTML = html;
 $('#sub-pages').appendChild(div);
requestAnimationFrame(() => { requestAnimationFrame(() => { div.classList.add('active'); }); });
subPageStack.push(div);
}

function goBack() {
if (subPageStack.length === 0) return;
const top = subPageStack.pop();
top.classList.remove('active');
top.classList.add('exiting');
setTimeout(() => top.remove(), 400);
}

function togglePw(btn) {
const inp = btn.parentElement.querySelector('input');
const icon = btn.querySelector('i');
if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
}

function otpNext(inp) {
if (inp.value.length === 1) { const next = inp.nextElementSibling; if (next) next.focus(); }
}

function otpBack(e, inp) {
if (e.key === 'Backspace' && !inp.value) { const prev = inp.previousElementSibling; if (prev) prev.focus(); }
}

function handleAuth(e, type) {
e.preventDefault();
if (type === 'signup') {
const cpw = $('#auth-cpw');
if (cpw && $('#auth-pw').value !== cpw.value) { showToast('Passwords do not match'); return; }
}
showToast('Verifying credentials...');
setTimeout(() => { renderAuth('otp'); }, 800);
}

function handleForgot(e) { e.preventDefault(); showToast('Reset link sent to your email'); setTimeout(() => renderAuth('otp'), 1000); }
function handleReset(e) { e.preventDefault(); const p = $('#reset-pw'), c = $('#reset-cpw'); if (p.value !== c.value) { showToast('Passwords do not match'); return; } showToast('Password updated successfully'); setTimeout(() => enterApp(), 800); }
function handleOtp(e) { e.preventDefault(); showToast('Verification successful'); setTimeout(() => enterApp(), 600); }
function resendOtp() { const b = $('#resend-btn'); b.disabled = true; b.textContent = 'Resend in 30s'; let t = 30; const iv = setInterval(() => { t--; b.textContent = `Resend in ${t}s`; if (t <= 0) { clearInterval(iv); b.disabled = false; b.textContent = 'Resend'; } }, 1000); showToast('OTP resent'); }

</div>`;

function handleSearchInput(query) {
const container = $('#search-results');
if (!query.trim()) {
renderSearchOverlay();
return;
}
const q = query.toLowerCase();
const allItems = [
...CITY_SERVICES.map((s, i) => ({...s, type:'city-services', idx:i, cat:'City Services'})),
...EXPLORE_PLACES.map((s, i) => ({...s, type:'explore', idx:i, cat:'Explore'})),
...CITIZEN_SERVICES.map((s, i) => ({...s, type:'citizen', idx:i, cat:'Citizen'})),
...EMERGENCY_SERVICES.map((s, i) => ({...s, type:'emergency', idx:i, cat:'Emergency'}))
];
const results = allItems.filter(item => item.name.toLowerCase().includes(q) || (item.desc && item.desc.toLowerCase().includes(q)) || (item.cat && item.cat.toLowerCase().includes(q)));

if (results.length === 0) {
container.innerHTML = `<div style="text-align:center;padding:40px 0"><i class="fas fa-search" style="font-size:40px;color:var(--text3);margin-bottom:12px"></i><p style="font-size:14px;color:var(--text2)">No results found for "${query}"</p><p style="font-size:12px;color:var(--text3);margin-top:4px">Try different keywords</p></div>`;
return;
}

container.innerHTML = `<h3>${results.length} Results</h3><div class="search-results">${results.map(r => `
<div class="sr-item" onclick="closeSearch();setTimeout(()=>openDetail('${r.type}',${r.idx}),350)">
<div class="sr-icon" style="background:${r.color}"><i class="fas ${r.icon}"></i></div>
<div class="sr-info"><h4>${r.name}</h4><p>${r.cat}${r.address ? ' &bull; ' + r.address : ''}</p></div>
<span class="sr-cat">${r.cat}</span>
</div>`).join('')}</div>`;
}

function searchFor(query) {
const input = $('#search-input');
if (input) { input.value = query; handleSearchInput(query); }
}

function startVoiceSearch() {
const modal = $('#voice-modal');
modal.classList.add('active');
setTimeout(() => { modal.classList.remove('active'); showToast('Voice search not available in browser'); }, 2500);
}

/* ========== INIT ========== */
document.addEventListener('DOMContentLoaded', () => {
initSplash();
});

document.addEventListener('keydown', (e) => {
if (e.key === 'Escape' || e.key === 'Backspace') {
if ($('#search-overlay').classList.contains('active')) { closeSearch(); e.preventDefault(); }
else if (subPageStack.length > 0) { goBack(); e.preventDefault(); }
}
});

 $('#voice-modal').addEventListener('click', function() { this.classList.remove('active'); });
</script>
</body>
</html>
